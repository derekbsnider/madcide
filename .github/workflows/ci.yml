# ci.yml — madcide built, tested and packaged on Linux, Windows and macOS:
# each job takes madc from a madc release's assets, builds madcide with it,
# runs madcide's full suite against it (madc's own test runner, from madc's
# source at the same tag), then packages madcide WITH that release
# (MADC_PACKAGE): every package stands alone, one download, one installer.
# Each installed check runs on madcide's package alone, no other madc present.
# The suite answers "is this madcide compatible with that madc", never "is
# madc correct": madc's own lanes gate madc.
#
# The madc release is v<madcide.json's "madc"> (the madc madcide is built
# for), or the dispatch's madc_tag. A draft release's assets read with the
# MADC_RELEASES_TOKEN secret (read access to madc's releases); a published
# release's read with the workflow's own token. madc's release rehearsal
# (madc's scripts/release_rehearsal.sh) dispatches this with madc_tag = the
# candidate's draft and madc_ref = the candidate commit, before madc tags it.
#
# A v* tag also drafts madcide's release with every package and their
# SHA256SUMS; the tag must be v<MADCIDE_VERSION>
# (tools/madcide/madcide_version.h).
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      madc_tag:
        description: "the madc release to build against (default: v<madcide.json's madc>)"
        required: false
        default: ''
      madc_ref:
        description: "madc's source for its test runner (default: madc_tag). A madc release rehearsal names the candidate commit: its tag does not exist yet, its packages are in the draft"
        required: false
        default: ''

env:
  MADC_REPO: derekbsnider/madc

jobs:
  madc:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      ref: ${{ inputs.madc_ref || steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: tag
        env:
          WANT: ${{ inputs.madc_tag }}
        run: |
          tag=$WANT
          if [ -z "$tag" ]; then
            pin=$(sed -n 's/^[[:space:]]*"madc":[[:space:]]*"\([0-9.]*\)".*/\1/p' madcide.json)
            if [ -z "$pin" ]; then
              echo "madcide.json names no \"madc\" release" >&2
              exit 1
            fi
            tag=v$pin
          fi
          echo "madc $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  linux:
    runs-on: ubuntu-24.04
    needs: madc
    env:
      MADC_TAG: ${{ needs.madc.outputs.tag }}
      GH_TOKEN: ${{ secrets.MADC_RELEASES_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0    # testmadcide_git reads the history of a tracked file
      - name: madc's source at the same tag (its test runner and fixture gate)
        uses: actions/checkout@v7
        with:
          repository: derekbsnider/madc
          ref: ${{ needs.madc.outputs.ref }}
          path: madc-src
          sparse-checkout: scripts
      - name: dependencies (the window's libraries, the display for its tests, rpmbuild)
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            libwebkitgtk-6.0-4 libgtk-4-1 xvfb rpm
      - name: madc, from its release's tarball
        run: |
          gh release download "$MADC_TAG" -R "$MADC_REPO" -p 'madc-*-linux-x86_64.tar.gz' -D "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP"/madc-*-linux-x86_64.tar.gz -C "$RUNNER_TEMP"
          folder=$(ls -d "$RUNNER_TEMP"/madc-*-linux-x86_64)
          echo "MADC=$folder/bin/madc" >> "$GITHUB_ENV"
          echo "MADC_PACKAGE=$(ls "$RUNNER_TEMP"/madc-*-linux-x86_64.tar.gz)" >> "$GITHUB_ENV"
      - name: build
        run: bash scripts/build.sh
      - name: gates (static, then the editor on a pty)
        run: bash scripts/gates.sh
      - name: tests
        run: MADC_FAIL_DETAIL=20 bash scripts/run_tests.sh
      - name: window tests
        # Ubuntu 24.04's AppArmor denies an unprofiled program's user
        # namespaces, which WebKit's bwrap sandbox needs (LP: #2046844).
        # The test windows run under the tarball's madc, which no profile
        # names, so the runner lifts the restriction for them.
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          MADC_FAIL_DETAIL=20 xvfb-run -a bash scripts/run_tests.sh --gui
      - name: packages (.deb, .rpm, tarball)
        run: MADCIDE_BUILD=build bash scripts/package_linux.sh
      - name: installed — the tarball alone
        run: |
          mkdir "$RUNNER_TEMP/alone"
          tar -xzf dist/madcide-*-linux-x86_64.tar.gz -C "$RUNNER_TEMP/alone"
          bash scripts/check_install.sh "$(ls -d "$RUNNER_TEMP"/alone/madcide-*-linux-x86_64)"
      - name: installed — the .deb alone, its window under Ubuntu's AppArmor default
        # The restriction back on, as a 24.04 desktop has it: the installed
        # window comes up by the profile madcide's .deb carries.
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ./dist/madcide_*ubuntu24.04_amd64.deb
          sudo bash scripts/check_install.sh /usr/lib/madcide
          xvfb-run -a bash scripts/check_apparmor.sh
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            dist/madcide_*.deb
            dist/madcide-*.rpm
            dist/madcide-*-linux-*.tar.gz
          if-no-files-found: error

  linux-jammy:
    # Ubuntu 22.04's .deb, built on 22.04 with madc's 22.04 .deb, which it
    # carries (one .deb per Ubuntu release, as madc's). madc is installed
    # with apt for the build, then removed: madcide's .deb installs alone.
    runs-on: ubuntu-22.04
    needs: madc
    env:
      MADC_TAG: ${{ needs.madc.outputs.tag }}
      GH_TOKEN: ${{ secrets.MADC_RELEASES_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0    # testmadcide_git reads the history of a tracked file
      - name: madc's source at the same tag (its test runner)
        uses: actions/checkout@v7
        with:
          repository: derekbsnider/madc
          ref: ${{ needs.madc.outputs.ref }}
          path: madc-src
          sparse-checkout: scripts
      - name: madc, from its release's 22.04 .deb
        run: |
          # A release asset's name has '.' where the package file had '~'
          # (GitHub's spelling), so the pattern names neither.
          gh release download "$MADC_TAG" -R "$MADC_REPO" -p 'madc_*ubuntu22.04_amd64.deb' -D "$RUNNER_TEMP"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq "$RUNNER_TEMP"/madc_*ubuntu22.04_amd64.deb xvfb
          echo "MADC=/usr/bin/madc" >> "$GITHUB_ENV"
          echo "MADC_PACKAGE=$(ls "$RUNNER_TEMP"/madc_*ubuntu22.04_amd64.deb)" >> "$GITHUB_ENV"
      - name: build
        run: bash scripts/build.sh
      - name: tests
        run: MADC_FAIL_DETAIL=20 bash scripts/run_tests.sh
      - name: window tests
        run: MADC_FAIL_DETAIL=20 xvfb-run -a bash scripts/run_tests.sh --gui
      - name: package (.deb)
        run: MADCIDE_BUILD=build bash scripts/package_linux.sh --deb
      - name: installed — the .deb alone, madc's removed
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get purge -y -qq madc
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ./dist/madcide_*ubuntu22.04_amd64.deb
          sudo bash scripts/check_install.sh /usr/lib/madcide
      - uses: actions/upload-artifact@v7
        with:
          name: linux-jammy
          path: dist/madcide_*~ubuntu22.04_amd64.deb
          if-no-files-found: error

  windows-suite:
    # madcide's suite on the Windows madc, under wine: madc's own wine lane
    # (madc's test runner drives madc.exe through MADC_WRAPPER=wine, the
    # fixtures' win64 and wine64 domains). The genuine-Windows run of the
    # built packages is the windows job's.
    runs-on: ubuntu-24.04
    needs: madc
    env:
      MADC_TAG: ${{ needs.madc.outputs.tag }}
      GH_TOKEN: ${{ secrets.MADC_RELEASES_TOKEN || github.token }}
      WINEDEBUG: -all
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0    # testmadcide_git reads the history of a tracked file
      - name: madc's source at the same tag (its test runner)
        uses: actions/checkout@v7
        with:
          repository: derekbsnider/madc
          ref: ${{ needs.madc.outputs.ref }}
          path: madc-src
          sparse-checkout: scripts
      - name: wine
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq wine64 unzip
          wineboot --init || true
          wineserver -w || true
          wineserver -p || true
      - name: madc, from its release's zip
        run: |
          gh release download "$MADC_TAG" -R "$MADC_REPO" -p 'madc-*-windows-x86_64.zip' -D "$RUNNER_TEMP"
          unzip -q "$RUNNER_TEMP"/madc-*-windows-x86_64.zip -d "$RUNNER_TEMP"
          echo "MADC=wine $(ls -d "$RUNNER_TEMP"/madc-*-windows-x86_64)/bin/madc.exe" >> "$GITHUB_ENV"
      - name: tests
        run: MADC_FAIL_DETAIL=20 bash scripts/run_tests.sh

  windows:
    runs-on: windows-latest
    needs: madc
    defaults:
      run:
        shell: bash
    env:
      MADC_TAG: ${{ needs.madc.outputs.tag }}
      GH_TOKEN: ${{ secrets.MADC_RELEASES_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: zip and unzip
        run: choco install zip unzip -y --no-progress
      - name: madc, from its release's zip
        run: |
          tmp=$(cygpath -u "$RUNNER_TEMP")
          gh release download "$MADC_TAG" -R "$MADC_REPO" -p 'madc-*-windows-x86_64.zip' -D "$tmp"
          unzip -q "$tmp"/madc-*-windows-x86_64.zip -d "$tmp"
          echo "MADC=$(ls -d "$tmp"/madc-*-windows-x86_64)/bin/madc.exe" >> "$GITHUB_ENV"
          echo "MADC_PACKAGE=$(ls "$tmp"/madc-*-windows-x86_64.zip)" >> "$GITHUB_ENV"
      - name: package (zip)
        run: bash scripts/package_windows.sh
      - name: installed — the zip alone
        run: |
          alone=$(cygpath -u "$RUNNER_TEMP")/alone
          mkdir "$alone"
          unzip -q dist/madcide-*-windows-x86_64.zip -d "$alone"
          bash scripts/check_install.sh "$(ls -d "$alone"/madcide-*-windows-x86_64)"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/madcide-*-windows-x86_64.zip
          if-no-files-found: error

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    needs: madc
    env:
      MADC_TAG: ${{ needs.madc.outputs.tag }}
      GH_TOKEN: ${{ secrets.MADC_RELEASES_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0    # testmadcide_git reads the history of a tracked file
      - name: madc's source at the same tag (its test runner)
        uses: actions/checkout@v7
        with:
          repository: derekbsnider/madc
          ref: ${{ needs.madc.outputs.ref }}
          path: madc-src
          sparse-checkout: scripts
      - name: coreutils (gtimeout)
        run: brew install coreutils
      - name: madc, from its release's tarball
        run: |
          gh release download "$MADC_TAG" -R "$MADC_REPO" -p "madc-*-macos-${{ matrix.arch }}.tar.gz" -D "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP"/madc-*-macos-${{ matrix.arch }}.tar.gz -C "$RUNNER_TEMP"
          folder=$(ls -d "$RUNNER_TEMP"/madc-*-macos-${{ matrix.arch }})
          echo "MADC=$folder/bin/madc" >> "$GITHUB_ENV"
          echo "MADC_PACKAGE=$(ls "$RUNNER_TEMP"/madc-*-macos-${{ matrix.arch }}.tar.gz)" >> "$GITHUB_ENV"
      - name: build
        run: bash scripts/build.sh
      - name: tests
        run: MADC_FAIL_DETAIL=20 bash scripts/run_tests.sh
      - name: package (tarball)
        run: MADCIDE_BUILD=build bash scripts/package_macos.sh
      - name: installed — the tarball alone
        run: |
          mkdir "$RUNNER_TEMP/alone"
          tar -xzf dist/madcide-*-macos-*.tar.gz -C "$RUNNER_TEMP/alone"
          bash scripts/check_install.sh "$(ls -d "$RUNNER_TEMP"/alone/madcide-*-macos-*)"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: dist/madcide-*-macos-*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, linux-jammy, windows-suite, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: the tag is madcide's version
        run: |
          ver=$(sed -n 's/^#define MADCIDE_VERSION "\(.*\)"$/\1/p' tools/madcide/madcide_version.h)
          if [ "$GITHUB_REF_NAME" != "v$ver" ]; then
            echo "tag $GITHUB_REF_NAME is not v$ver (tools/madcide/madcide_version.h)" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: draft the release
        run: |
          cd dist
          # GitHub stores '~' in an asset's name as '.': rename first, so
          # SHA256SUMS names the files people download.
          for f in madcide*~*; do
            [ -e "$f" ] && mv "$f" "${f//\~/.}"
          done
          sha256sum madcide* > SHA256SUMS
          cat SHA256SUMS
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft \
            --title "madcide ${GITHUB_REF_NAME#v}" \
            --notes "Draft: the packages CI built and checked on Linux, Windows and macOS." \
            madcide* SHA256SUMS
